name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: notes-src/requirements.txt
      - run: pip install -r notes-src/requirements.txt
      # Static pages are published as-is; the notes are built into /notes/.
      - run: rsync -a --exclude .git --exclude .github --exclude notes-src --exclude .venv ./ _site/
      - run: mkdocs build --strict -f notes-src/mkdocs.yml -d "$PWD/_site/notes"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
