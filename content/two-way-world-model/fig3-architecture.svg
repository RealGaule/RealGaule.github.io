<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d">
<title id="t">Architecture of the predictor-corrector world model, one chunk</title>
<desc id="d">Top row, 3D to video: the point state and the action enter the 3D predictor, its prediction is rendered into an eight-channel condition video and injected into a frozen Wan2.1 DiT through channel concatenation and a condition trunk at five blocks; a four-step sampler emits the video chunk. Bottom row, video to 3D: a clean pass exposes block-15 features, a readout head queried by the state returns per-point displacement, covariance and visibility, and the fusion module combines it with the prediction, fixes robot points by kinematics, projects with ARAP and writes the next state.</desc>
<style>
text{font-family:Roboto,Helvetica,Arial,sans-serif;font-size:12.5px;fill:#222222}
.h{font-size:13.5px;font-weight:600} .H{font-size:15px;font-weight:600}
.s{font-size:11.5px;fill:#555555} .m{text-anchor:middle} .e{text-anchor:end}
.cb{fill:#3b5bdb} .co{fill:#c2410c} .cg{fill:#6b7280} .w{font-weight:600}
.box{fill:#fff;stroke-width:1.6} .b{stroke:#3b5bdb} .o{stroke:#c2410c} .g{stroke:#6b7280}
.frz{fill:#eceff3;stroke:#6b7280;stroke-width:1.4}
.lb{stroke:#3b5bdb;stroke-width:1.8;fill:none} .lo{stroke:#c2410c;stroke-width:1.8;fill:none}
.lg{stroke:#6b7280;stroke-width:1.4;fill:none} .dash{stroke-dasharray:5 4}
</style>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="600" fill="#fff"/>
<text x="280" y="22" class="m" >action a<tspan dy="3" font-size="9">t</tspan><tspan dy="-3">: robot point flow ΔX</tspan><tspan dy="3" font-size="9">rob</tspan><tspan dy="-3"> from forward kinematics</tspan></text>
<path d="M280,30 L280,68" class="lb" marker-end="url(#ab)"/>
<rect x="15" y="120" width="150" height="120" rx="4" class="box b"/>
<text x="90" y="142" class="m h" >State S<tspan dy="3" font-size="9">t</tspan></text>
<text x="90" y="161" class="m s" >4096 scene, 512 robot pts</text>
<text x="90" y="177" class="m s" >X, f (DINOv3), skin, Σ</text>
<text x="90" y="193" class="m s" >robot points move by FK</text>
<text x="90" y="209" class="m s" >Gaussian skin for rendering</text>
<text x="90" y="225" class="m s" >the state is the memory</text>
<rect x="200" y="70" width="160" height="100" rx="4" class="box b"/>
<text x="280" y="90" class="m h" >A. 3D predictor f<tspan dy="3" font-size="9">θ</tspan></text>
<text x="280" y="107" class="m s" >PTv3, 12 blocks, d 512</text>
<text x="280" y="122" class="m s" >SE(3) clusters + residual</text>
<text x="280" y="137" class="m s" >aleatoric variance, contact</text>
<text x="280" y="157" class="m" >→ μ<tspan dy="3" font-size="9">f</tspan><tspan dy="-3">, Σ</tspan><tspan dy="3" font-size="9">f</tspan><tspan dy="-3"> for 8 steps</tspan></text>
<rect x="400" y="70" width="120" height="100" rx="4" class="box g"/>
<text x="460" y="90" class="m h" >Render</text>
<text x="460" y="107" class="m s" >gsplat skin after μ<tspan dy="3" font-size="9">f</tspan></text>
<text x="460" y="122" class="m s" >+ URDF robot render</text>
<text x="460" y="142" class="m" >C: RGB, log-depth,</text>
<text x="460" y="158" class="m" >robot, mask (8 ch)</text>
<rect x="560" y="30" width="290" height="220" rx="4" class="frz"/>
<text x="705" y="50" class="m h" >B. Wan2.1 DiT 1.3B, frozen</text>
<text x="705" y="66" class="m s" >30 blocks, d 1536, LoRA r64 on attn + FFN</text>
<rect x="585" y="80" width="26" height="150" fill="#fff" stroke="#6b7280"/>
<line x1="585" y1="90" x2="611" y2="90" stroke="#cfd3d8"/>
<line x1="585" y1="100" x2="611" y2="100" stroke="#cfd3d8"/>
<line x1="585" y1="110" x2="611" y2="110" stroke="#cfd3d8"/>
<line x1="585" y1="120" x2="611" y2="120" stroke="#cfd3d8"/>
<line x1="585" y1="130" x2="611" y2="130" stroke="#cfd3d8"/>
<line x1="585" y1="140" x2="611" y2="140" stroke="#cfd3d8"/>
<line x1="585" y1="150" x2="611" y2="150" stroke="#cfd3d8"/>
<line x1="585" y1="160" x2="611" y2="160" stroke="#cfd3d8"/>
<line x1="585" y1="170" x2="611" y2="170" stroke="#cfd3d8"/>
<line x1="585" y1="180" x2="611" y2="180" stroke="#cfd3d8"/>
<line x1="585" y1="190" x2="611" y2="190" stroke="#cfd3d8"/>
<line x1="585" y1="200" x2="611" y2="200" stroke="#cfd3d8"/>
<line x1="585" y1="210" x2="611" y2="210" stroke="#cfd3d8"/>
<line x1="585" y1="220" x2="611" y2="220" stroke="#cfd3d8"/>
<text x="598" y="245" class="s m" >blocks 0–29</text>
<line x1="632" y1="80" x2="632" y2="200" class="lo"/>
<path d="M632,80 L614,80" class="lo" marker-end="url(#ao)"/>
<text x="638" y="84" class="s" >0</text>
<path d="M632,110 L614,110" class="lo" marker-end="url(#ao)"/>
<text x="638" y="114" class="s" >6</text>
<path d="M632,140 L614,140" class="lo" marker-end="url(#ao)"/>
<text x="638" y="144" class="s" >12</text>
<path d="M632,170 L614,170" class="lo" marker-end="url(#ao)"/>
<text x="638" y="174" class="s" >18</text>
<path d="M632,200 L614,200" class="lo" marker-end="url(#ao)"/>
<text x="638" y="204" class="s" >24</text>
<rect x="662" y="150" width="180" height="44" rx="4" class="box o"/>
<text x="752" y="167" class="m" >condition trunk (trainable)</text>
<text x="752" y="184" class="m s" >4 DiT blocks, zero-init adds</text>
<line x1="662" y1="186" x2="633" y2="186" class="lo"/>
<text x="662" y="96" class="" >input: noisy latent ⊕ C latents</text>
<text x="662" y="111" class="s" >channel concat, zero-init projection</text>
<text x="662" y="127" class="s" >anchor = last observed frame</text>
<text x="662" y="218" class="" >4-step distilled sampler</text>
<text x="662" y="234" class="s" >trainable: LoRA + trunk only</text>
<rect x="870" y="90" width="120" height="70" rx="4" class="box g"/>
<text x="930" y="112" class="m h" >video chunk</text>
<text x="930" y="130" class="m s" >8 frames at 5 Hz</text>
<text x="930" y="146" class="m s" >480 × 640</text>
<rect x="560" y="340" width="290" height="56" rx="4" class="frz"/>
<text x="705" y="360" class="m" >clean pass at t = 0 → block-15 features</text>
<text x="705" y="378" class="m s" >m: 3 × 30 × 40 × 1536 (3600 tokens)</text>
<rect x="330" y="340" width="195" height="125" rx="4" class="box o"/>
<text x="427" y="360" class="m h" >C. Readout h<tspan dy="3" font-size="9">ψ</tspan></text>
<text x="427" y="377" class="m s" >queries: f, current (u, v); no μ<tspan dy="3" font-size="9">f</tspan></text>
<text x="427" y="392" class="m s" >4 cross-attn blocks, 2 iterations</text>
<text x="427" y="407" class="m s" >deformable sampling on m</text>
<text x="427" y="422" class="m s" >DPT depth head → spawn points</text>
<text x="427" y="444" class="m" >→ μ<tspan dy="3" font-size="9">h</tspan><tspan dy="-3">, Σ</tspan><tspan dy="3" font-size="9">h</tspan><tspan dy="-3">, visibility v</tspan></text>
<rect x="165" y="340" width="145" height="140" rx="4" class="box b"/>
<text x="237" y="360" class="m h" >D. Fusion</text>
<text x="237" y="377" class="m s" >gate α from Σ<tspan dy="3" font-size="9">f</tspan><tspan dy="-3">, Σ</tspan><tspan dy="3" font-size="9">h</tspan><tspan dy="-3">, v</tspan></text>
<text x="237" y="392" class="m s" >precision-weighted update</text>
<text x="237" y="407" class="m s" >robot points := FK</text>
<text x="237" y="422" class="m s" >ARAP projection</text>
<text x="237" y="437" class="m s" >skin: 5 Adam steps</text>
<text x="237" y="459" class="m" >→ S<tspan dy="3" font-size="9">t+1</tspan><tspan dy="-3">, Σ + Q</tspan></text>
<path d="M165,150 L198,122" class="lb" marker-end="url(#ab)"/>
<text x="130" y="112" class="s m" >point tokens</text>
<path d="M360,120 L398,120" class="lb" marker-end="url(#ab)"/>
<text x="380" y="112" class="s m" >μ<tspan dy="3" font-size="9">f</tspan></text>
<path d="M520,120 L558,120" class="lb" marker-end="url(#ab)"/>
<text x="540" y="112" class="s m" >C</text>
<path d="M850,125 L868,125" class="lo" marker-end="url(#ao)"/>
<text x="859" y="117" class="s m" >x₀</text>
<path d="M705,250 L705,338" class="lo" marker-end="url(#ao)"/>
<text x="712" y="298" class="s" >x<tspan dy="3" font-size="9">0</tspan><tspan dy="-3"> (generated)</tspan></text>
<path d="M560,368 L527,368" class="lo" marker-end="url(#ao)"/>
<text x="543" y="360" class="s m" >k, v</text>
<path d="M330,350 L312,350" class="lo" marker-end="url(#ao)"/>
<text x="320" y="331" class="s m" >μ<tspan dy="3" font-size="9">h</tspan><tspan dy="-3">, Σ</tspan><tspan dy="3" font-size="9">h</tspan><tspan dy="-3">, v</tspan></text>
<path d="M240,170 L240,338" class="lb" marker-end="url(#ab)"/>
<text x="247" y="262" class="s" >μ<tspan dy="3" font-size="9">f</tspan><tspan dy="-3">, Σ</tspan><tspan dy="3" font-size="9">f</tspan></text>
<path d="M165,362 H100 V242" class="lb" marker-end="url(#ab)"/>
<text x="92" y="300" class="s e" >S<tspan dy="3" font-size="9">t+1</tspan></text>
<path d="M60,240 V540 H427 V467" class="lg" marker-end="url(#ag)"/>
<text x="250" y="553" class="s m" >queries: point feature f and current projection (u, v), not the prediction</text>
<path d="M237,480 L237,508" class="lb" marker-end="url(#ab)"/>
<text x="237" y="523" class="s m" >disagreement d<tspan dy="3" font-size="9">t</tspan><tspan dy="-3"> = ‖μ</tspan><tspan dy="3" font-size="9">f</tspan><tspan dy="-3"> − μ</tspan><tspan dy="3" font-size="9">h</tspan><tspan dy="-3">‖</tspan></text>
<rect x="20" y="575" width="16" height="12" rx="2" class="frz"/>
<text x="42" y="585" class="s" >frozen</text>
<rect x="100" y="575" width="16" height="12" rx="2" class="box b"/>
<text x="122" y="585" class="s" >trainable, 3D side</text>
<rect x="230" y="575" width="16" height="12" rx="2" class="box o"/>
<text x="252" y="585" class="s" >trainable, video side</text>
<path d="M380,581 L412,581" class="lb" marker-end="url(#ab)"/>
<text x="418" y="585" class="s" >3D → video</text>
<path d="M500,581 L532,581" class="lo" marker-end="url(#ao)"/>
<text x="538" y="585" class="s" >video → 3D</text>
<text x="650" y="585" class="s" >one chunk = 9 frames at 5 Hz; f<tspan dy="3" font-size="9">θ</tspan><tspan dy="-3"> ≈ 0.1 s, g</tspan><tspan dy="3" font-size="9">φ</tspan><tspan dy="-3"> ≈ 1 s on one H100</tspan></text>
</svg>
